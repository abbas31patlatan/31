name: Fetch Brawlhalla

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/brawlhalla-fetch.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install SteamCMD runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1 ca-certificates curl
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -L --fail --retry 3 "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/steamcmd"

      - name: Download official Brawlhalla Windows build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/brawlhalla"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
            +@sSteamCmdForcePlatformType windows \
            +force_install_dir "$GITHUB_WORKSPACE/brawlhalla" \
            +login anonymous \
            +app_license_request 291550 \
            +app_update 291550 validate \
            +quit
          du -sh "$GITHUB_WORKSPACE/brawlhalla"
          find "$GITHUB_WORKSPACE/brawlhalla" -maxdepth 2 -type f | head -50

      - name: Upload Brawlhalla
        uses: actions/upload-artifact@v4
        with:
          name: brawlhalla-windows
          path: brawlhalla/
          compression-level: 0
          retention-days: 1
