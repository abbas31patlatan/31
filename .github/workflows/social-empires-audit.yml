name: Social Empires gateway and source checks

on:
  push:
    branches: [social-empires-revival]
    paths:
      - "social-empires/**"
      - ".github/workflows/social-empires-audit.yml"
  pull_request:
    paths:
      - "social-empires/**"
      - ".github/workflows/social-empires-audit.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gateway test dependency
        run: python -m pip install "Flask>=3.1,<4"
      - name: Run account and audit unit tests
        run: python -m unittest discover -s social-empires/tests -v
      - name: Download fixed upstream source snapshot (text only)
        run: |
          mkdir -p upstream-source/templates
          SHA=f642e0bae5a341f48e73b58f2e6d33a8436992c1
          for file in server.py sessions.py command.py templates/play.html templates/ruffle.html requirements.txt; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "upstream-source/$file" \
              "https://raw.githubusercontent.com/AcidCaos/socialemperors/$SHA/$file"
          done
      - name: Produce route and legacy-dependency report
        run: |
          python social-empires/tools/audit_upstream.py \
            --path upstream-source \
            --output upstream-report.json
          python -m json.tool upstream-report.json > /dev/null
          python -c 'import json; r=json.load(open("upstream-report.json")); print("Routes:", r["route_count"]); print("Indicators:", r["indicators"]); assert r["route_count"] > 0; assert not r["missing_required_files"]'
      - name: Verify upstream integration patch and syntax
        run: |
          python social-empires/tools/patch_upstream.py --path upstream-source
          python -m compileall -q upstream-source
          python - <<'PY'
          from pathlib import Path
          p = Path("upstream-source")
          server = (p / "server.py").read_text()
          assert "install_revival(app, new_village)" in server
          assert "app.secret_key = 'SECRET_KEY'" not in server
          assert "SERVERIP=host" not in server
          for template in ("play.html", "ruffle.html"):
              t = (p / "templates" / template).read_text()
              assert "http://{{SERVERIP}}:5050" not in t
              assert 'action="/signout"' in t
          print("Pinned upstream integration: PASS")
          PY
      - name: Fetch upstream source/config fixture (sparse)
        run: |
          git init upstream-game
          git -C upstream-game remote add origin https://github.com/AcidCaos/socialemperors.git
          git -C upstream-game sparse-checkout init --cone
          git -C upstream-game sparse-checkout set config villages templates stub
          git -C upstream-game -c protocol.version=2 fetch --depth=1 --filter=blob:none origin f642e0bae5a341f48e73b58f2e6d33a8436992c1
          git -C upstream-game checkout --detach FETCH_HEAD
          test "$(git -C upstream-game rev-parse HEAD)" = "f642e0bae5a341f48e73b58f2e6d33a8436992c1"
      - name: Test patched real game server against two independent accounts
        run: |
          python -m pip install -r upstream-game/requirements.txt
          python social-empires/tools/patch_upstream.py --path upstream-game
          python social-empires/tools/smoke_game.py --path upstream-game
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-audit
          path: upstream-report.json
          retention-days: 14
