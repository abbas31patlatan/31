name: Social Empires audit tool tests

on:
  push:
    branches: [social-empires-revival]
    paths:
      - "social-empires/**"
      - ".github/workflows/social-empires-audit.yml"
  pull_request:
    paths:
      - "social-empires/**"
      - ".github/workflows/social-empires-audit.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run source audit unit tests
        run: python -m unittest discover -s social-empires/tests -v
      - name: Download fixed upstream source snapshot (text only)
        run: |
          mkdir -p upstream-source/templates
          SHA=f642e0bae5a341f48e73b58f2e6d33a8436992c1
          for file in server.py sessions.py templates/play.html templates/ruffle.html requirements.txt; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "upstream-source/$file" \
              "https://raw.githubusercontent.com/AcidCaos/socialemperors/$SHA/$file"
          done
      - name: Produce route and legacy-dependency report
        run: |
          python social-empires/tools/audit_upstream.py \
            --path upstream-source \
            --output upstream-report.json
          python -m json.tool upstream-report.json > /dev/null
          python -c 'import json; r=json.load(open("upstream-report.json")); print("Routes:", r["route_count"]); print("Indicators:", r["indicators"]); assert r["route_count"] > 0; assert not r["missing_required_files"]'
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-audit
          path: upstream-report.json
          retention-days: 14
